[project]
name = "passbroker"
version = "0.3.0"
description = "Let AI assistants sign in, unlock files and run home-device actions with Proton Pass secrets, without ever seeing them."
readme = "README.md"
license = "MIT"
authors = [
    { name = "asafelobotomy", email = "213836723+asafelobotomy@users.noreply.github.com" }
]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
]
dependencies = [
    "httpx2>=2.16,<3",
    "keyring>=25.7,<26",
    "mcp>=2.3,<3",
    "playwright>=1.64.1,<2",
    "starlette>=1.10,<2",
    "uvicorn>=0.54,<1",
]

[project.urls]
Repository = "https://github.com/asafelobotomy/pass-broker"
Issues = "https://github.com/asafelobotomy/pass-broker/issues"

[build-system]
requires = ["uv_build>=0.12.23,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "deptry==0.25.1",
    "pip-audit==2.10.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff==0.17.3",
]

[project.scripts]
passbroker = "passbroker.cli:main"


[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["needs(*tools): skipped when a tool isn't installed, but failed in CI, which installs them all"]

# cargo deny check: known vulnerabilities, licences we can ship under MIT, and crates only from crates.io.
[graph]
targets = ["x86_64-unknown-linux-gnu"]

[advisories]
# Unmaintained crates are reported, but only ones we depend on directly fail the check.
unmaintained = "workspace"
ignore = []

[licenses]
allow = [
    "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
    "ISC", "Zlib", "0BSD", "CC0-1.0", "Unlicense", "Unicode-3.0",
    # Slint, used under its royalty-free desktop licence: the About screen shows AboutSlint.
    "LicenseRef-Slint-Royalty-free-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"

# cargo deny check: known vulnerabilities, licences we can ship under MIT, and crates only from crates.io.
[graph]
targets = ["x86_64-unknown-linux-gnu"]

[advisories]
# Every unmaintained crate fails the check, except these, which come in through Slint and the
# tray (ksni), both at their latest versions: nothing to move to yet. cargo-deny warns when one
# of them is no longer used, so it can come off this list.
unmaintained = "all"
ignore = [
    { id = "RUSTSEC-2026-0370", reason = "zvariant, via ksni and Slint's accessibility (zbus)" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names, via ksni and Slint's accessibility (zbus)" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive, via ksni and Slint's accessibility (zbus)" },
    { id = "RUSTSEC-2026-0441", reason = "pin-utils, via slint-macros and slint-build (spin_on)" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser, via winit's window decorations (sctk-adwaita)" },
]

[licenses]
allow = [
    "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
    "ISC", "Zlib", "0BSD", "CC0-1.0", "Unlicense", "Unicode-3.0",
    # Slint, used under its royalty-free desktop licence: the About screen shows AboutSlint.
    "LicenseRef-Slint-Royalty-free-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"

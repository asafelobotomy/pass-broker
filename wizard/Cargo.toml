[package]
name = "passbroker-wizard"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Setup wizard and control center for Pass Broker"
repository = "https://github.com/asafelobotomy/pass-broker"

[dependencies]
arboard = { version = "3.7.0", features = ["wayland-data-control"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }
ksni = { version = "0.3.7", default-features = false, features = ["blocking", "async-io"] }
libc = "0.2.191"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
slint = "1.18.1"

[build-dependencies]
slint-build = "1.18.1"

[profile.release]
strip = true
lto = "thin"

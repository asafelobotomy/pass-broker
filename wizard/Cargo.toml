[package]
name = "passbroker-wizard"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
arboard = { version = "3.7.0", features = ["wayland-data-control"] }
libc = "0.2.191"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
slint = "1.18.1"

[build-dependencies]
slint-build = "1.18.1"

[profile.release]
strip = true
lto = "thin"

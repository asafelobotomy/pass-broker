name: AppImage

# Built on the oldest supported Ubuntu, so the AppImage runs on any desktop Linux with
# glibc 2.35 or newer (the bundled Python needs only 2.17; the wizard sets the floor).
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  appimage:
    name: Build AppImage
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: wizard
      - name: Build tools and the libraries the wizard links against
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends squashfs-tools libfontconfig1-dev libxkbcommon-dev libwayland-dev libxcb1-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - name: Build
        run: packaging/appimage/build.sh
      - name: Smoke test (no FUSE on the runner)
        run: APPIMAGE_EXTRACT_AND_RUN=1 dist/Pass_Broker-x86_64.AppImage passbroker --help
      - name: Checksum
        run: cd dist && sha256sum Pass_Broker-x86_64.AppImage > Pass_Broker-x86_64.AppImage.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Pass_Broker-x86_64.AppImage
          path: |
            dist/Pass_Broker-x86_64.AppImage
            dist/Pass_Broker-x86_64.AppImage.sha256
          if-no-files-found: error
